name: CI
on:
  push:
    branches: [main, "hitech-*"]
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://naehpbwtziqwjqubhpqc.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DEV_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.DEV_SUPABASE_SECRET_KEY }}
      SUPABASE_DB_URL: ${{ secrets.DEV_SUPABASE_DB_URL }}
      CRON_SECRET: ${{ secrets.DEV_CRON_SECRET }}
      BOOKING_SYSTEM: engine
      N8N_MODE: stub
      AIRTABLE_MODE: stub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
